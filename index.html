function refreshJudgeHeader(pid) {
  const it = document.getElementById('ji-' + pid); const p = findProject(pid);
  if (!it || !p || it.classList.contains('open')) { updateJudgeProgress(); return; }
  it.innerHTML = judgeHeader(p); bindJudgeItem(it); updateJudgeProgress();
}
function updateJudgeProgress() {
  const list = judgeProjects(); const done = list.filter(p => S.judgeScores[p.project_id]).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  const bar = $('#jbar'), txt = $('#jprog');
  if (txt) txt.textContent = `${done} of ${list.length} models scored${done === list.length && list.length ? '. All done, thank you!' : ''}`;
  if (bar) setTimeout(() => { bar.style.width = pct + '%'; }, 60);
  return { done, total: list.length };
}
function bindJudgeItem(it) {
  const btn = $('.jtoggle', it); if (btn) btn.addEventListener('click', () => toggleJudgeItem(it));
}
function closeJudgeItem(it) {
  it.classList.remove('open'); const pn = $('.jpanel', it); if (pn) pn.remove();
  const b = $('.jtoggle', it); if (b) b.setAttribute('aria-expanded', 'false');
}
function toggleJudgeItem(it, forceOpen) {
  const isOpen = it.classList.contains('open');
  $$('.jitem.open').forEach(x => { if (x !== it) closeJudgeItem(x); });
  if (isOpen && !forceOpen) { closeJudgeItem(it); setBgFx('cycle'); return; }
  if (isOpen) return;
  const p = findProject(it.id.slice(3)); if (!p) return;
  it.classList.add('open'); $('.jtoggle', it).setAttribute('aria-expanded', 'true');
  it.insertAdjacentHTML('beforeend', scorePanel(p));
  bindScorePanel(it, p);
  setBgFx(p.category);
  setTimeout(() => it.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }), 50);
}
function scorePanel(p) {
  const cs = critFor(p.category); const max = maxMark();
  const prev = S.judgeScores[p.project_id];
  const locked = toBool(S.data.settings.judging_locked);
  const sec = (key, title, marks, list) => `<div class="jsec" data-sec="${key}">
    <div class="jsec-head"><b>${title}</b><span data-sectot="${key}">0 of ${marks}</span></div>
    <div class="jsec-body">
      ${list.map((t, i) => { const c = splitCrit(t); return `<div class="crit">
        <div class="crit-head"><span>${esc(c.name)}${c.q ? `<small>${esc(c.q)}</small>` : ''}</span><strong data-cv="${key}${i}"></strong></div>
        <div class="nums" role="group" aria-label="${esc(c.name)}">${Array.from({ length: max }, (_, k) => k + 1).map(v => `<button class="num" data-s="${key}" data-i="${i}" data-v="${v}" aria-pressed="false" ${locked ? 'disabled' : ''}>${v}</button>`).join('')}</div>
      </div>`; }).join('')}
      <label class="field" style="margin-top:12px"><span>Comments for this section (optional)</span><textarea class="jrem" data-cm="${key}" maxlength="500" ${locked ? 'disabled' : ''}>${esc((prev && prev.comments && prev.comments[key]) || '')}</textarea></label>
    </div>
  </div>`;
  return `<div class="jpanel">
    ${locked ? '<p class="banner">Judging is locked. You can view but not change scores.</p>' : ''}
    ${prev ? '<p class="banner" style="background:var(--ok-t);color:var(--ok)">Already scored. Change any mark and save again to update it.</p>' : ''}
    ${sec('a', 'Section A: Common criteria', 8 * max, cs.a)}
    ${sec('b', `Section B: ${p.category === 'Math' ? 'Mathematics' : p.category === 'Tech' ? 'Technology' : 'Science'} project`, 5 * max, cs.b)}
    ${sec('c', 'Section C: Presentation and viva', 2 * max, cs.c)}
    <p class="err jerr2" role="alert" style="margin-top:8px"></p>
    <div class="savebar"><span class="tot">Total <b class="jtot">0</b> of ${15 * max}</span>${locked ? '' : '<button class="btn btn-primary jsave">Save score</button>'}</div>
  </div>`;
}
function bindScorePanel(it, p) {
  const panel = $('.jpanel', it); const max = maxMark();
  const prev = S.judgeScores[p.project_id];
  const vals = {
    a: prev && prev.a ? prev.a.slice() : new Array(8).fill(null),
    b: prev && prev.b ? prev.b.slice() : new Array(5).fill(null),
    c: prev && prev.c ? prev.c.slice() : new Array(2).fill(null)
  };
  const err = $('.jerr2', panel);
  const marks = { a: 8 * max, b: 5 * max, c: 2 * max };
  const paint = () => {
    ['a', 'b', 'c'].forEach(k => {
      vals[k].forEach((v, i) => { const el = $(`[data-cv="${k}${i}"]`, panel); el.textContent = v == null ? 'Not marked' : `${v} of ${max}`; el.className = v == null ? 'unset' : ''; });
      $(`[data-sectot="${k}"]`, panel).textContent = `${vals[k].reduce((x, v) => x + (v || 0), 0)} of ${marks[k]}`;
    });
    $$('.num', panel).forEach(b => b.setAttribute('aria-pressed', String(vals[b.dataset.s][+b.dataset.i] === +b.dataset.v)));
    $('.jtot', panel).textContent = ['a', 'b', 'c'].reduce((t, k) => t + vals[k].reduce((x, v) => x + (v || 0), 0), 0);
  };
  $$('.num', panel).forEach(b => b.addEventListener('click', () => {
    vals[b.dataset.s][+b.dataset.i] = +b.dataset.v; paint();
    if (['a', 'b', 'c'].every(k => vals[k].every(v => v != null))) err.textContent = '';
  }));
  paint();
  const save = $('.jsave', panel);
  if (save) save.addEventListener('click', async () => {
    const missing = ['a', 'b', 'c'].filter(k => vals[k].some(v => v == null));
    if (missing.length) {
      err.textContent = `Give a mark for every criterion in Section ${missing.map(k => k.toUpperCase()).join(', ')} before saving.`;
      const first = $(`.jsec[data-sec="${missing[0]}"]`, panel); if (first) first.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' });
      return;
    }
    err.textContent = '';
    const comments = {}; $$('.jrem', panel).forEach(t => { comments[t.dataset.cm] = t.value; });
    const total = ['a', 'b', 'c'].reduce((t, k) => t + vals[k].reduce((x, v) => x + v, 0), 0);
    S.judgeScores[p.project_id] = { a: vals.a.slice(), b: vals.b.slice(), c: vals.c.slice(), total, comments };
    saveJudgeScores();
    Queue.add({ id: Date.now() + '-' + randStr(4), key: 'score|' + p.project_id, type: 'score', pid: p.project_id, body: { action: 'score', judge_id: S.judge.judge_id, pin: S.judge.pin, project_id: p.project_id, scores: { a: vals.a.slice(), b: vals.b.slice(), c: vals.c.slice() }, comments } });
    closeJudgeItem(it);
    it.innerHTML = judgeHeader(p, true); bindJudgeItem(it);
    setBgFx('cycle');
    const pr = updateJudgeProgress();
    toast(`Score saved for ${p.project_id}`);
    if (pr.done === pr.total && pr.total) confetti(70);
  });
}

function downloadCsv() {
  const rows = [['Category', 'List', 'Rank', 'Project ID', 'Stall', 'Model', 'Centre', 'Judges average (of 50)', 'Judges who scored', 'Visitor points', 'Visitor ratings', 'Visitor average (of 15)', 'Exact tie']];
  CATS.forEach(c => {
    const r = S.admin.results[c];
    r.judges.forEach((x, i) => rows.push([c, 'Judges', i + 1, x.project_id, x.stall, x.title, x.centre, x.avg, x.n, x.points, x.raters, x.pavg, x.tie ? 'Yes' : '']));
    r.people.forEach((x, i) => rows.push([c, "People's Choice", i + 1, x.project_id, x.stall, x.title, x.centre, x.avg, x.n, x.points, x.raters, x.pavg, x.tie ? 'Yes' : '']));
  });
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = 'stem-fest-results.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* Corner themed animations for the projector */
const rnd = (a, b) => a + Math.random() * (b - a);
function themeFx(cat, level) {
  if (REDUCED) return '';
  let h = '';
  const burst = (n, makeItem) => { let b = ''; for (let i = 0; i < n; i++) { const ang = Math.random() * Math.PI * 2, dist = rnd(20, 48); b += `<i style="--tx:${(Math.cos(ang) * dist).toFixed(1)}vw;--ty:${(Math.sin(ang) * dist).toFixed(1)}vh;--r:${rnd(-240, 240).toFixed(0)}deg;animation-delay:${rnd(0, .25).toFixed(2)}s">${makeItem(i)}</i>`; } return `<div class="burst">${b}</div>`; };
  if (cat === 'Science') {
    const n = [10, 20, 34][level];
    for (let i = 0; i < n; i++) { const sz = rnd(1.5, 6); h += `<i class="bub" style="left:${rnd(0, 100).toFixed(1)}%;width:${sz.toFixed(1)}vh;height:${sz.toFixed(1)}vh;animation-duration:${rnd(6, 12).toFixed(1)}s;animation-delay:-${rnd(0, 10).toFixed(1)}s"></i>`; }
    h += `<span class="fx-spin" style="left:4vw;top:8vh;width:22vh;height:22vh;animation-duration:14s">${stemSvg('atom')}</span>`;
    h += `<span class="fx-spin" style="right:5vw;bottom:10vh;width:28vh;height:28vh;animation-duration:20s;animation-direction:reverse">${stemSvg('atom')}</span>`;
    if (level) h += `<span class="fx-spin" style="right:8vw;top:10vh;width:14vh;height:14vh;animation-duration:9s;opacity:.22">${stemSvg('dna')}</span><span class="fx-spin" style="left:8vw;bottom:12vh;width:14vh;height:14vh;animation-duration:26s;opacity:.22">${stemSvg('flask')}</span>`;
    if (level === 2) h += burst(26, () => `<span style="display:block;width:${rnd(1.5, 4).toFixed(1)}vh;height:${rnd(1.5, 4).toFixed(1)}vh;border-radius:50%;border:.3vh solid #fff;background:rgba(255,255,255,.25)"></span>`);
  } else if (cat === 'Math') {
    const syms = ['π', '√', '∑', '∞', '÷', '×', '+', '=', '∫', 'Δ', 'θ', '%', 'x²', 'φ', '≈'];
    const n = [10, 18, 30][level];
    for (let i = 0; i < n; i++) h += `<span class="msym" style="left:${rnd(0, 100).toFixed(1)}%;font-size:${rnd(3, 8).toFixed(1)}vh;--r:${rnd(-360, 360).toFixed(0)}deg;animation-duration:${rnd(7, 14).toFixed(1)}s;animation-delay:-${rnd(0, 12).toFixed(1)}s">${syms[i % syms.length]}</span>`;
    h += `<svg class="geo" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#F2A900" stroke-width=".35" opacity=".45">
      <g class="rot"><path class="d" d="M18 70 L38 34 L58 70 Z"/></g>
      <g class="rot" style="animation-direction:reverse"><circle class="d" cx="136" cy="24" r="12"/><path class="d" d="M124 24 H148 M136 12 V36"/></g>
      <path class="d" d="M112 80 L148 80 L112 56 Z"/><path class="d" d="M112 74 H118 V80"/>
      <path class="d" d="M8 14 Q20 2 32 14 T56 14"/>
      ${level ? '<g class="rot"><rect class="d" x="130" y="52" width="14" height="14"/></g><path class="d" d="M60 86 A26 26 0 0 1 100 86"/>' : ''}
    </svg>`;
    if (level === 2) h += burst(24, i => `<span style="font-family:'Baloo 2',serif;font-weight:800;font-size:${rnd(3, 6).toFixed(1)}vh;color:#F2A900">${syms[i % syms.length]}</span>`);
  } else {
    const cols = [8, 14, 22][level];
    for (let i = 0; i < cols; i++) { let t = ''; for (let k = 0; k < 18; k++) t += (Math.random() < .5 ? '0' : '1') + '\n'; h += `<span class="bits" style="left:${(i / cols * 100 + rnd(0, 3)).toFixed(1)}%;animation-duration:${rnd(5, 10).toFixed(1)}s;animation-delay:-${rnd(0, 8).toFixed(1)}s">${t}</span>`; }
    h += `<svg class="trace" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#C9C1FF" stroke-width=".4" opacity=".6">
      <path class="d" d="M0 20 H30 L38 28 H60"/><circle class="node" cx="60" cy="28" r="1.2" fill="#F2A900" style="animation-delay:2.2s"/>
      <path class="d" d="M160 70 H128 L120 62 H96" style="animation-delay:.3s"/><circle class="node" cx="96" cy="62" r="1.2" fill="#F2A900" style="animation-delay:2.5s"/>
      <path class="d" d="M20 90 V72 L28 64 H44" style="animation-delay:.6s"/><circle class="node" cx="44" cy="64" r="1.2" fill="#F2A900" style="animation-delay:2.8s"/>
      <path class="d" d="M140 0 V16 L132 24 H112" style="animation-delay:.9s"/><circle class="node" cx="112" cy="24" r="1.2" fill="#F2A900" style="animation-delay:3.1s"/>
    </svg>`;
    h += `<span class="fx-spin" style="left:3vw;bottom:6vh;width:24vh;height:24vh;animation-duration:12s">${stemSvg('gear')}</span><span class="fx-spin" style="left:calc(3vw + 19vh);bottom:22vh;width:14vh;height:14vh;animation-duration:8s;animation-direction:reverse">${stemSvg('gear')}</span>`;
    if (level) h += `<span class="fx-spin" style="right:5vw;top:8vh;width:18vh;height:18vh;animation-duration:16s;opacity:.22">${stemSvg('chip' in STEM ? 'chip' : 'circuit')}</span>`;
    if (level === 2) h += burst(26, () => `<span style="font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:${rnd(2.5, 5).toFixed(1)}vh;color:${Math.random() < .5 ? '#F2A900' : '#C9C1FF'}">${Math.random() < .5 ? '0' : '1'}</span>`);
  }
  return `<div class="fx" aria-hidden="true">${h}</div>`;
}
let bgMode = null, bgTimer = null, bgIdx = 0;
function paintBg(cat) {
  const el = $('#bgfx'); if (!el) return;
  el.className = 'c-' + CAT_CLS[cat];
  el.innerHTML = themeFx(cat, 0);
}
function setBgFx(mode) {
  const el = $('#bgfx'); if (!el || REDUCED) return;
  if (mode === bgMode) return;
  bgMode = mode; clearInterval(bgTimer); bgTimer = null;
  if (!mode) { el.innerHTML = ''; return; }
  const swap = cat => { el.classList.add('fade'); setTimeout(() => { paintBg(cat); el.classList.remove('fade'); }, 700); };
  if (mode === 'cycle') {
    swap(CATS[bgIdx % 3]);
    bgTimer = setInterval(() => { bgIdx++; swap(CATS[bgIdx % 3]); }, 12000);
  } else swap(mode);
}
function heartFx() {
  if (REDUCED) return '';
  let h = '';
  for (let i = 0; i < 16; i++) { const sz = rnd(2.5, 7); h += `<span class="floatheart" style="left:${rnd(0, 100).toFixed(1)}%;width:${sz.toFixed(1)}vh;height:${sz.toFixed(1)}vh;--r:${rnd(-40, 40).toFixed(0)}deg;animation-duration:${rnd(7, 12).toFixed(1)}s;animation-delay:-${rnd(0, 10).toFixed(1)}s"><svg viewBox="0 0 24 24">${ICONS.heart}</svg></span>`; }
  return `<div class="fx" aria-hidden="true">${h}</div>`;
}
function slideHtml(sl) {
  const s = S.data.settings; const yl = logoSrc(s.yojak_logo), fl = logoSrc(s.fest_logo); const pl = partnerList().filter(p => p.logo);
  const logos = [yl && `<img src="${esc(yl)}" alt="YOJAK">`, fl && `<img src="${esc(fl)}" alt="STEM FEST">`, ...pl.map(p => `<img src="${esc(p.logo)}" alt="${esc(p.name)}">`)].filter(Boolean).join('');
  if (sl.type === 'intro') return `<div class="slide">${logos ? `<div class="s-logos">${logos}</div>` : ''}<p class="s-kicker">Prize distribution</p><p class="s-big">${esc(s.event_name || 'STEM FEST')}</p><div class="s-spark">${sparkWords()}</div></div>`;
  const sub = w => esc([isTbd(w.centre) ? '' : w.centre, w.stall ? 'stall ' + w.stall : ''].filter(Boolean).join(', '));
  if (sl.type === 'cat') return themeFx(sl.cat, 0) + `<div class="slide"><div class="s-icon" style="width:14vh;height:14vh;margin:0 auto 3vh;color:#fff">${icon(CAT_ICON[sl.cat])}</div><p class="s-kicker" style="color:#fff;opacity:.85">Judges' awards for the</p><p class="s-big">${sl.cat} corner</p></div>`;
  if (sl.type === 'place') return themeFx(sl.cat, sl.place === 1 ? 2 : 1) + `<div class="slide"><p class="s-kicker">${sl.cat} corner, Judges' award</p><div class="s-place ${sl.place === 1 ? 'first' : ''}" style="margin-top:3vh">${['', '1st', '2nd', '3rd'][sl.place]}</div><p class="s-mid">${esc(sl.w.title)}</p>${sl.w.project_id ? `<span class="s-id">${esc(sl.w.project_id)}</span>` : ''}<p class="s-sub">${sub(sl.w)}</p></div>`;
  if (sl.type === 'pchead') return heartFx() + `<div class="slide"><div class="s-place first"><span class="s-icon" style="width:8vh;height:8vh;display:block;color:var(--maroon-deep)">${icon('heart').replace('fill="none"', 'fill="currentColor"')}</span></div><p class="s-big">People's Choice awards</p><p class="s-sub">Chosen by our visitors, one winner from each corner</p></div>`;
  if (sl.type === 'people') return themeFx(sl.cat, 2) + `<div class="slide"><p class="s-kicker">${sl.cat} corner</p><div class="s-place first" style="margin-top:3vh"><span class="s-icon" style="width:8vh;height:8vh;display:block;color:var(--maroon-deep)">${icon('heart').replace('fill="none"', 'fill="currentColor"')}</span></div><p class="s-kicker" style="font-size:4.4vh">People's Choice</p><p class="s-mid">${esc(sl.w.title)}</p>${sl.w.project_id ? `<span class="s-id">${esc(sl.w.project_id)}</span>` : ''}<p class="s-sub">${sub(sl.w)}</p></div>`;
  return `<div class="slide"><p class="s-big">Congratulations!</p><p class="s-sub">To every young maker at ${esc(s.event_name || 'STEM FEST')}. Keep sparking.</p>${logos ? `<div class="s-logos" style="margin-top:5vh">${logos}</div>` : ''}${pl.length ? `<p class="s-sub" style="font-size:2.6vh">${esc(orTbd(s.partner_label, 'Supported by'))} ${esc(pl.map(p => p.name).filter(Boolean).join(', '))}</p>` : ''}</div>`;
}
VIEWS.reveal = () => {
  if (!S.adminKey || !S.admin) return adminLogin();
  const slides = revealSlides();
  revealIdx = Math.min(revealIdx, slides.length - 1);
  return {
    html: `<div class="stage" id="stage"></div>`,
    mount() {
      document.body.classList.add('projector');
      if (revealIdx === 0 && hasTies() && !confirm('There is an exact tie affecting a winning place. Check the dashboard first. Continue with the Winners reveal anyway?')) { location.hash = '#/admin'; return; }
      const stage = $('#stage');
      const show = () => {
        const sl = slides[revealIdx];
        stage.className = 'stage' + (sl.type === 'cat' ? ' cat c-' + CAT_CLS[sl.cat] : (sl.cat ? ' th c-' + CAT_CLS[sl.cat] : ''));
        stage.innerHTML = slideHtml(sl) + `<span class="s-count">${revealIdx + 1} / ${slides.length}</span><span class="s-hint">Right arrow or click: next. Left arrow: back. F: full screen. Esc: dashboard.</span>`;
        $$('.poppers').forEach(x => x.remove());
        if (sl.type === 'place' || sl.type === 'people') setTimeout(() => confetti(130), 300);
        if (sl.type === 'end') confetti(160);
      };
      const next = () => { if (revealIdx < slides.length - 1) { revealIdx++; show(); } };
      const prev = () => { if (revealIdx > 0) { revealIdx--; show(); } };
      stage.addEventListener('click', next);
      window.onkeydown = e => {
        if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
        else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
        else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
        else if (e.key === 'Escape' && !document.fullscreenElement) { location.hash = '#/admin'; }
      };
      show();
    }
  };
};

/* ================================================================
   ROUTER
   ================================================================ */
function route() { return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent); }

function renderNotice() {
  const n = $('#notice'); let html = '';
  if (DEMO) html += `<div class="demo"><div class="wrap">Preview mode: sample data, and ratings are saved only on this phone.</div></div>`;
  const a = S.data?.settings?.announcement;
  if (a && !isTbd(a)) html += `<div class="announce" role="status"><div class="wrap">${icon('megaphone').replace('<svg', '<svg style="width:22px;height:22px;flex:none;margin-top:1px"')}<span>${esc(a)}</span></div></div>`;
  n.innerHTML = html;
}
function renderTop(page) {
  const el = $('#topright');
  if (page === 'judge') { el.textContent = 'Judge portal'; return; }
  if (page === 'admin' || page === 'staff') { el.textContent = 'Organisers'; return; }
  el.innerHTML = `<a class="judge-btn" href="#/judge">${icon('gavel')}<span>Judges</span></a>`;
}

function shellHtml(page) {
  if (page && page !== 'home') return '<div class="loading"><div class="spin"></div>Loading STEM FEST</div>';
  const words = ['Seek', 'Probe', 'Analyze', 'Rethink', 'Kreate'];
  return `<section class="hero">${floaters()}<div class="wrap"><div class="hero-in">
      <p class="presents">YOJAK presents</p>
      <h1 class="title">STEM FEST</h1>
      <div class="spark-row"><span class="spark-label">Theme: SPARK</span>${words.map((w, i) => `<span class="sw" style="animation-delay:${0.2 + i * 0.25}s"><b>${w[0]}</b><span>${w.slice(1)}</span></span>`).join('')}</div>
      <p class="cd-label">Loading today's details...</p>
    </div></div></section>
    <div class="wrap"><div class="corners-strip">${CATS.map(c => `<span class="ctile c-${CAT_CLS[c]}">${icon(CAT_ICON[c])}<span class="ctile-name">${c}</span></span>`).join('')}</div>
    <div class="sk" style="height:84px;margin-top:22px"></div><div class="sk" style="height:160px;margin-top:14px"></div></div>`;
}

let lastPage = null;
function render() {
  clearInterval(timer); timer = null; clearInterval(ticker); ticker = null;
  window.onkeydown = null;
  if (scrollHandler) { window.removeEventListener('scroll', scrollHandler); scrollHandler = null; }
  const [page = 'home', a] = route();
  if (page !== 'reveal') document.body.classList.remove('projector');
  const printPage = page === 'admin' && ['qr', 'codes', 'judgecards', 'envelopes'].includes(a);
  if (page === 'reveal' || printPage) setBgFx(null);
  else if (page === 'project' && S.data) { const pr = findProject(a); setBgFx(pr ? pr.category : 'cycle'); }
  else setBgFx('cycle');
  const navPage = page === 'project' ? 'projects' : page;
  $$('.tabs a, .topnav a').forEach(x => x.classList.toggle('on', x.dataset.p === navPage));
  renderTop(page);
  renderNotice();
  const app = $('#app');
  if (!S.data) {
    app.innerHTML = S.error ? emptyState('Could not load', S.error, '', '') : shellHtml(page);
    return;
  }
  const v = (VIEWS[page] || VIEWS.home)(a);
  app.innerHTML = v.html;
  const key = page + '/' + (a || '');
  if (key !== lastPage) window.scrollTo(0, 0);
  lastPage = key;
  if (v.mount) v.mount(app);
  observeReveals();
}

window.addEventListener('hashchange', render);

/* Refresh public info every 3 minutes, only where it matters */
setInterval(async () => {
  if (document.hidden) return;
  const page = route()[0] || 'home';
  if (!['home', 'schedule', 'venue', 'help', 'results'].includes(page)) return;
  await loadData(); render();
}, REFRESH_MS);

(async function start() {
  if (!DEMO) {
    const cached = jparse(store.get('sf_cache'), null);
    if (cached) S.data = prepData(cached);
  }
  if (S.data) { const vid = voterId(); S.rated = vid ? jparse(store.get('sf_rated:' + vid), {}) : {}; }
  render();                       /* show something immediately */
  syncPill(); processQueue();     /* send anything saved earlier but not yet sent */
  await loadData();
  const vid = voterId(); S.rated = vid ? jparse(store.get('sf_rated:' + vid), {}) : {};
  render();
  const changed = await syncRatings(false);   /* in the background */
  if (changed && ['home', 'projects', ''].includes(route()[0] || '')) render();
})();
</script>
